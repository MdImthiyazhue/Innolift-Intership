<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Mohamed Imthiyaz — Portfolio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="{{ url_for('home') }}" class="brand">M. Imthiyaz</a>
      <nav class="nav">
        <a href="{{ url_for('home') }}" class="{{ 'active' if active_page == 'home' }}">Home</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if active_page == 'about' }}">About</a>
        <a href="{{ url_for('contact') }}" class="{{ 'active' if active_page == 'contact' }}">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Mohamed Imthiyaz · Built with Flask for Day 31, Innolift Ventures</p>
    </div>
  </footer>

</body>
</html>
